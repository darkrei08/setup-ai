name: publish

# Trusted publishing: npm accepts the OIDC identity of this workflow, so no
# long-lived registry token lives in the repository. One-time setup on
# npmjs.com -> @darkrei08/setup-ai -> Settings -> Trusted Publisher:
#   Organization or user: darkrei08
#   Repository:           setup-ai
#   Workflow filename:    publish.yml
# Push an annotated vX.Y.Z tag from protected main for automatic publication.
# Manual dispatch remains available for reruns or recovery.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Annotated version tag to publish (vX.Y.Z)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Validate the tag shape
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag must look like vX.Y.Z" >&2
            exit 1
          fi

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Verify the annotated tag is on main and matches package.json
        run: |
          test "$(git cat-file -t "$RELEASE_TAG")" = tag
          git fetch origin main --tags
          git merge-base --is-ancestor "$(git rev-parse 'HEAD^{commit}')" origin/main
          version="$(node -p "require('./package.json').version")"
          test "v${version}" = "$RELEASE_TAG"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$RELEASE_TAG" --generate-notes
          fi

  publish:
    needs: release
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing (OIDC) needs npm >= 11.5.1; the npm bundled with
      # Node 22 is older and publishes unauthenticated, which npm answers with 404.
      - name: Use an npm that supports trusted publishing
        run: npm install -g npm@latest

      - name: Verify the annotated tag is on main and matches package.json
        run: |
          test "$(git cat-file -t "$RELEASE_TAG")" = tag
          git fetch origin main --tags
          git merge-base --is-ancestor "$(git rev-parse 'HEAD^{commit}')" origin/main
          version="$(node -p "require('./package.json').version")"
          test "v${version}" = "$RELEASE_TAG"

      - name: Verify the package
        run: |
          bash -n setup-ai.sh
          node --check bin/setup-ai.mjs
          npm pack --dry-run

      # Provenance is disabled: npm rejects a sigstore bundle whose source
      # repository is private (422). Trusted publishing (OIDC) still authenticates
      # the job. Flip this to --provenance once the repository is public.
      - name: Publish to npm
        run: npm publish --access public --provenance=false
