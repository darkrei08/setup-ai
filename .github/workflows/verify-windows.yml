name: verify-windows

# Temporary native Windows verification for a candidate branch. This file lives only on
# throwaway verify/windows-* branches and is never merged.
on:
  push:
    branches: ["verify/windows-**"]

permissions:
  contents: read

jobs:
  gates:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Parse setup-ai.ps1
        run: $null = [ScriptBlock]::Create((Get-Content -Raw setup-ai.ps1)); "parse-ok"
      - name: PowerShell lifecycle regression
        run: pwsh -NoLogo -NoProfile -File tests/powershell-lifecycle.ps1
      - name: Launcher list and uninstall inventory
        run: |
          node bin/setup-ai.mjs --list
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node bin/setup-ai.mjs --uninstall
      - name: Missing scheduled task error shape
        run: |
          try { Get-ScheduledTask -TaskName setup-ai-no-such-task -ErrorAction Stop }
          catch {
            "FQEID=$($_.FullyQualifiedErrorId)"
            "Category=$($_.CategoryInfo.Category)"
            "Type=$($_.Exception.GetType().FullName)"
            "HResult=$($_.Exception.HResult)"
          }

  rotator-native:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Install rotator through the launcher (first run)
        run: node bin/setup-ai.mjs --only rotator --yes; exit $LASTEXITCODE
      - name: Read back the scheduled task receipt
        id: first
        run: |
          $t = Get-ScheduledTask -TaskName tuxevil-rotator -ErrorAction Stop
          $t | Format-List TaskName,TaskPath,State,Description
          $t.Actions | Format-List Execute,Arguments
          $t.Triggers | Format-List
          if ($t.Description -notmatch '\[(?<m>[\w.-]+):fp=(?<fp>[0-9a-f]{16})\]\s*$') { throw "task has no setup-ai receipt" }
          "desc=$($t.Description)" | Out-File -Append $env:GITHUB_OUTPUT
      - name: Rerun preserves the existing task
        run: |
          node bin/setup-ai.mjs --only rotator --yes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $t = Get-ScheduledTask -TaskName tuxevil-rotator -ErrorAction Stop
          if ($t.Description -ne '${{ steps.first.outputs.desc }}') { throw "rerun replaced the task: $($t.Description)" }
          "task preserved: $($t.Description)"
      - name: Uninstall inventory and removal
        run: |
          node bin/setup-ai.mjs --uninstall --only rotator
          node bin/setup-ai.mjs --uninstall --only rotator --yes
          $code = $LASTEXITCODE
          $t = Get-ScheduledTask -TaskName tuxevil-rotator -ErrorAction SilentlyContinue
          "task after uninstall: $([bool]$t)"
          "npm package: $(npm ls -g tuxevil-rotator --depth 0 2>&1 | Out-String)"
          exit $code
      - name: Foreign task is never claimed or removed
        run: |
          $action = New-ScheduledTaskAction -Execute "cmd.exe" -Argument "/c exit 0"
          $trigger = New-ScheduledTaskTrigger -Once -At (Get-Date).AddDays(1)
          Register-ScheduledTask -TaskName tuxevil-rotator -Action $action -Trigger $trigger -Description "user task" -Force | Out-Null
          node bin/setup-ai.mjs --only rotator --yes
          node bin/setup-ai.mjs --uninstall --only rotator --yes
          $t = Get-ScheduledTask -TaskName tuxevil-rotator -ErrorAction Stop
          if ($t.Description -ne "user task" -or $t.Actions[0].Execute -ne "cmd.exe") { throw "foreign task was modified" }
          "foreign task preserved"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rotator-logs
          path: logs/

  module:
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { module: node, cmd: node }
          - { module: bun, cmd: bun }
          - { module: pi, cmd: pi }
          - { module: lazyvim, cmd: nvim }
          - { module: go, cmd: go }
          - { module: herdr, cmd: herdr }
          - { module: claude-code, cmd: claude }
          - { module: codex, cmd: codex }
          - { module: antigravity, cmd: agy }
          - { module: opencode, cmd: opencode }
          - { module: gentle-ai, cmd: gentle-ai }
          - { module: pi-workflows, cmd: pi }
          - { module: ai-memory, cmd: aimem }
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Install ${{ matrix.module }}
        run: node bin/setup-ai.mjs --only ${{ matrix.module }} --yes; exit $LASTEXITCODE
      - name: Smoke ${{ matrix.cmd }} in a fresh shell
        if: always()
        run: |
          $env:Path = [Environment]::GetEnvironmentVariable('Path','Machine') + ';' + [Environment]::GetEnvironmentVariable('Path','User')
          $c = Get-Command ${{ matrix.cmd }} -ErrorAction SilentlyContinue
          if (-not $c) { throw "${{ matrix.cmd }} not on PATH" }
          "resolved: $($c.Source)"
          & ${{ matrix.cmd }} --version
          if ($LASTEXITCODE -ne 0) { throw "${{ matrix.cmd }} --version exited $LASTEXITCODE" }
      - name: Warnings and errors
        if: always()
        run: |
          Get-ChildItem logs -Filter *.jsonl -ErrorAction SilentlyContinue | ForEach-Object {
            Get-Content $_.FullName | ConvertFrom-Json | Where-Object { $_.lvl -in 'WARN','ERROR' } |
              Select-Object lvl,ph,ev,rc,msg,meta | Format-Table -AutoSize -Wrap
          }

  classic-install:
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Classic install (core set, unattended)
        run: node bin/setup-ai.mjs --yes; exit $LASTEXITCODE
      - name: Summarize JSONL results
        if: always()
        run: |
          Get-ChildItem logs -Filter *.jsonl -ErrorAction SilentlyContinue | ForEach-Object {
            Get-Content $_.FullName | ConvertFrom-Json | Where-Object { $_.lvl -in 'WARN','ERROR' } |
              Select-Object lvl,ph,ev,rc,msg,meta | Format-Table -AutoSize -Wrap
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: classic-install-logs
          path: logs/
